<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Arithmos</title>
    <meta name="description" content="Research companion for number theory and post-quantum cryptography." />
    <meta name="theme-color" content="#121212" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Arithmos" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Apply the saved theme and platform before first paint so there is no flash.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('arithmos.m.settings.v1') || '{}');
          var theme = s.theme === 'system'
            ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : (s.theme === 'light' ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
        } catch (e) { /* storage unavailable: keep dark */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Arithmos needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
